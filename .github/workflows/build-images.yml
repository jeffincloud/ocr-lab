name: build-images

# Publishes the lab's images to GHCR, tagged with VERSION and the commit SHA. The GPU
# VM pulls them, so they have to exist before `infra/nebius` can rebuild it.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/api/**"
      - "apps/frontend/**"
      - "apps/mock-llm/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  VERSION: "0.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, frontend, mock-llm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ocr-lab/${{ matrix.app }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ocr-lab/${{ matrix.app }}:${{ github.sha }}
