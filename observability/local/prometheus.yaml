global:
  scrape_interval: 10s
  evaluation_interval: 30s

# No scrape_configs: every metric arrives over OTLP from the collector
# (/api/v1/otlp), including the ones it scrapes from mock-llm and Tempo
# (local/scrape.yaml). Tempo's span metrics arrive by remote write.

rule_files:
  - /etc/prometheus/rules/*.yaml
  - /etc/prometheus/local-rules/*.yaml

otlp:
  # Turn OTel resource attributes into labels on every series.
  promote_resource_attributes:
    - service.name
    - service.version
    - deployment.environment.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.container.name
