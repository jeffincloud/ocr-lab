global:
  scrape_interval: 10s
  evaluation_interval: 30s

# Metrics from the API arrive over OTLP (collector -> /api/v1/otlp). These are
# the pull targets: the model server and the telemetry components themselves.
scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["mock-llm:8080"]
        labels: {engine: mock}
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

rule_files:
  - /etc/prometheus/rules/*.yaml
  - /etc/prometheus/local-rules/*.yaml

otlp:
  # Turn OTel resource attributes into labels on every series.
  promote_resource_attributes:
    - service.name
    - service.version
    - deployment.environment.name
    - k8s.namespace.name
    - k8s.pod.name
