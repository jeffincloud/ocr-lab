# Loki single binary on the filesystem: enough for a single-node lab.
# Receives logs over OTLP from the collector (http://loki-gateway/otlp).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    # 30 days, like Tempo and Prometheus. Only enforced if the compactor's
    # retention_enabled is set; it isn't, so today logs are kept until the disk fills.
    retention_period: 720h
singleBinary:
  replicas: 1
  persistence:
    size: 20Gi
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
