# kube-prometheus-stack for the OCR lab (single node). Release name: kps, namespace: monitoring.
fullnameOverride: kps

# Used for storage and rules only. Prometheus takes OTLP metrics from the
# collector (with exemplars) and remote-write from Tempo's metrics generator,
# and evaluates the SLO/cost rules from charts/observability. It scrapes
# nothing: the OpenTelemetry Collector collects every metric (including the
# Prometheus-format ones) and pushes OTLP. So the chart's exporters and
# ServiceMonitors are off; kube-state-metrics stays, scraped by the collector.

prometheus:
  prometheusSpec:
    # 30 days, like Tempo and Loki, so the lab's whole history lines up.
    retention: 30d
    retentionSize: 25GB
    # Without this, metrics live on an emptyDir and are lost when the pod is recreated.
    # local-path keeps them on the node's boot disk, so they survive a stop or
    # preemption but not a rebuild.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 30Gi
    enableOTLPReceiver: true
    enableRemoteWriteReceiver: true
    enableFeatures: [exemplar-storage]
    exemplars:
      maxSize: 100000
    otlp:
      promoteResourceAttributes:
        - service.name
        - service.version
        - deployment.environment.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
      # Keep OTel names readable in PromQL (ocr_extract_duration_seconds).
      translationStrategy: UnderscoreEscapingWithSuffixes
    # Pick up rules from every release, not just this chart's.
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 3Gi}
  serviceMonitor:
    selfMonitor: false

alertmanager:
  enabled: true
  serviceMonitor:
    selfMonitor: false
  # Alerts go to the collector, which stores them in Loki (service_name="alertmanager"),
  # so they show up in Grafana next to the signals that fired them. Add a Slack or
  # e-mail receiver here to page a person.
  config:
    route:
      receiver: collector
      group_by: [alertname, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      # The chart's default route still sends Watchdog here; without it the
      # operator rejects the whole config and keeps the old one.
      - name: "null"
      - name: collector
        webhook_configs:
          - url: http://otel-collector-opentelemetry-collector.monitoring.svc:8088/alerts
            send_resolved: true

# The default rules alert on node-exporter/kubelet series that no longer exist here.
defaultRules:
  create: false

# Nothing for Prometheus to scrape: the collector covers these (kubeletstats
# for pod/container resources, prometheus receiver for the rest).
nodeExporter:
  enabled: false
kubelet:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false
prometheusOperator:
  serviceMonitor:
    selfMonitor: false

kube-state-metrics:
  # kube_pod_status_ready_time / kube_pod_created feed the cold-start rules.
  # Scraped by the collector (charts/observability scrape.kubeStateMetrics).
  prometheus:
    monitor:
      enabled: false
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name,app.kubernetes.io/component,kserve.io/component]

grafana:
  adminPassword: change-me-ocr-lab
  serviceMonitor:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      uid: prometheus
      # Exemplar dots on latency panels open the trace in Tempo.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc:3200
      jsonData:
        serviceMap: {datasourceUid: prometheus}
        nodeGraph: {enabled: true}
        lokiSearch: {datasourceUid: loki}
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-2m"
          spanEndTimeShift: "2m"
          filterByTraceID: true
          customQuery: true
          # API and Envoy logs carry trace_id and match exactly. vLLM and the llm-d
          # scheduler log without it, so for them this returns their lines from the
          # span's time window (the scheduler's lines name the request's x-request-id).
          query: '{service_name="$${__span.tags["service.name"]}"} | json | trace_id="$${__span.traceId}" or (trace_id="" and service_name=~"vllm|inference-scheduler")'
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          queries:
            - name: Engine queue p95
              query: histogram_quantile(0.95, sum by (le) (rate(vllm:request_queue_time_seconds_bucket[1m])))
            - name: KV cache usage
              query: max(vllm:kv_cache_usage_perc)
            - name: GPU power
              query: sum(DCGM_FI_DEV_POWER_USAGE)
    - name: Loki
      uid: loki
      type: loki
      url: http://loki-gateway.monitoring.svc
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
          - name: TraceID (json)
            matcherRegex: '"trace_id":\s*"(\w+)"'
            datasourceUid: tempo
            url: "$${__value.raw}"
