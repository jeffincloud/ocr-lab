# Access log with timings, so the edge hop shows up in Loki/kubectl logs.
# $request_id is forwarded to the API as X-Request-ID and logged by both.
log_format timed escape=json '{"ts":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_length":$request_length,"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"traceparent":"$http_traceparent"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout timed;

    # Max upload ~10 MB — passport photos can exceed 1 MB easily.
    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the OCR API service.
    # API_HOST and API_PORT are substituted by nginx at container start
    # (processed from /etc/nginx/templates/default.conf.template).
    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        # W3C trace context from the browser or load generator passes through
        # unchanged (nginx forwards request headers by default).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
