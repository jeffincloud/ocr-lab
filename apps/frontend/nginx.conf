server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Max upload ~10 MB — passport photos can exceed 1 MB easily.
    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the OCR API service.
    # API_HOST and API_PORT are substituted by nginx at container start
    # (processed from /etc/nginx/templates/default.conf.template).
    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
