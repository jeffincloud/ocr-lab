apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-qwen-vl
  namespace: default
spec:
  supportedModelFormats:
    - name: huggingface
      autoSelect: false
      priority: 1
  protocolVersions:
    - v2
  containers:
    - name: kserve-container
      image: vllm/vllm-openai:v0.11.0
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - --port=8080
        - --model=Qwen/Qwen3-VL-4B-Instruct
        - --served-model-name=qwen3-vl-4b
        - --trust-remote-code
        - --dtype=float16
        - --gpu-memory-utilization=0.9
        - --max-model-len=8192
      env:
        - name: HF_HOME
          value: /root/.cache/huggingface
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
