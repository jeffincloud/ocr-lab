<text x="266.8" y="308.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C9D1D9" font-weight="normal" text-anchor="start">first content at 0.12 s</text>
<text x="30.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start">What the model writes for passport 22 (fictional data). Printed issue date: 31 AUG 19.</text>
<rect x="30.0" y="400.0" width="808.0" height="232.0" rx="14" fill="#EEF6FF" stroke="none" stroke-width="1"/>
<text x="50.0" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0086FF" font-weight="bold" text-anchor="start">Thinking on: reasoning, then JSON</text>
<rect x="50.0" y="444.0" width="768.0" height="130.0" rx="10" fill="#0D1117" stroke="none" stroke-width="1"/>
<text x="66.0" y="470.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#C9D1D9" font-weight="normal" text-anchor="start">5. Date of Birth: &quot;10 MAR 43&quot; ... So, 1943-03-10.</text>
<text x="66.0" y="493.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ED561B" font-weight="normal" text-anchor="start">7. Date of Issue: &quot;31 AUG 19&quot;. This implies 1919.</text>
<text x="66.0" y="516.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ED561B" font-weight="normal" text-anchor="start">8. Date of Expiry: &quot;30 AUG 29&quot;. This implies 1929.</text>
<text x="66.0" y="539.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#C9D1D9" font-weight="normal" text-anchor="start">Now I will format this into the requested JSON.</text>
<text x="66.0" y="562.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#93EAFF" font-weight="normal" text-anchor="start">{&quot;date_of_issue&quot;: &quot;1919-08-31&quot;, ...}</text>
<text x="50.0" y="598.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4B5563" font-weight="normal" text-anchor="start">Visible reasoning shows why it went wrong. In the batch the same</text>
<text x="50.0" y="618.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4B5563" font-weight="normal" text-anchor="start">passport came back right (2019): reasoning varies between runs.</text>
<rect x="862.0" y="400.0" width="808.0" height="232.0" rx="14" fill="#EDFAFE" stroke="none" stroke-width="1"/>
<text x="882.0" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#058DC7" font-weight="bold" text-anchor="start">Thinking off: JSON straight away</text>
<rect x="882.0" y="444.0" width="768.0" height="130.0" rx="10" fill="#0D1117" stroke="none" stroke-width="1"/>
<text x="898.0" y="470.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#C9D1D9" font-weight="normal" text-anchor="start">{</text>
<text x="898.0" y="493.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#C9D1D9" font-weight="normal" text-anchor="start">  &quot;date_of_birth&quot;: &quot;1943-03-10&quot;,</text>
<text x="898.0" y="516.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ED561B" font-weight="normal" text-anchor="start">  &quot;date_of_issue&quot;: &quot;1919-08-31&quot;,</text>
<text x="898.0" y="539.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ED561B" font-weight="normal" text-anchor="start">  &quot;date_of_expiry&quot;: &quot;1929-08-30&quot;,</text>
<text x="898.0" y="562.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#C9D1D9" font-weight="normal" text-anchor="start">  ...}</text>
<text x="882.0" y="598.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4B5563" font-weight="normal" text-anchor="start">Same mistake, no explanation. The MRZ check-digit step corrected</text>
<text x="882.0" y="618.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4B5563" font-weight="normal" text-anchor="start">the expiry to 2029; the issue date isn&#x27;t in the MRZ, so it stayed wrong.</text>
<text x="30.0" y="672.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="start">The whole batch: 40 passports each</text>
