<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1060" viewBox="0 0 1700 1060">
<rect x="0.0" y="0.0" width="1700.0" height="1060.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="30.0" y="56.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#111827" font-weight="bold" text-anchor="start">Thinking on vs off: same 40 passports, same model, same GPU</text>
<text x="30.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4B5563" font-weight="normal" text-anchor="start">Qwen3.5-9B FP8 on one L40S, 8 passports at a time through the public app. The only change is enable_thinking.</text>
