<text x="30.0" y="874.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4B5563" font-weight="normal" text-anchor="start">Green marks the better result. Wrong fields leave out nationality: both modes sometimes write the country name instead of the code, which is a format choice and not a misread.</text>
<rect x="30.0" y="900.0" width="1640.0" height="110.0" rx="16" fill="#F6F8FA" stroke="none" stroke-width="1"/>
<text x="56.0" y="940.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111827" font-weight="bold" text-anchor="start">What thinking bought: zero misread fields on every passport it answered.</text>
<text x="56.0" y="968.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4B5563" font-weight="normal" text-anchor="start">What it cost: 2.7× the latency, 3.2× the tokens, 10 s before the first character, and 3 of 40 passports with no answer at all</text>
<text x="56.0" y="990.0" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#4B5563" font-weight="normal" text-anchor="start">(reasoning ran into the 1,500-token cap). On this batch, thinking off delivered 3× more fully correct passports per minute.</text>
<text x="30.0" y="1038.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#4B5563" font-weight="normal" text-anchor="start">An earlier batch of 40 from the same generator (rotation, blur, noise) went harder against thinking off: 13 wrong fields of 320, against 0 with it on. Measured 3 Nov 2026.</text>
</svg>