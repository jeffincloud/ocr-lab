<text x="1463.7" y="738.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0086FF" font-weight="bold" text-anchor="start">thinking on</text>
<text x="1463.7" y="768.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#111827" font-weight="bold" text-anchor="start">$0.57</text>
