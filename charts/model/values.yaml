model:
  id: Qwen/Qwen3-VL-4B-Instruct
  servedName: qwen3-vl-4b

runtime:
  name: vllm-qwen-vl
  image: vllm/vllm-openai:v0.11.0
  dtype: float16
  maxModelLen: 8192
  gpuMemoryUtilization: 0.9
  trustRemoteCode: true
  extraArgs: []
  extraEnv: []

# vLLM request tracing (one span per request with queue/prefill/decode timings,
# joined to the API's trace through the traceparent header). Needs an image
# with the OpenTelemetry packages: build apps/vllm-otel and set runtime.image.
tracing:
  enabled: false
  otlpEndpoint: http://otel-collector-opentelemetry-collector.monitoring.svc:4317
  serviceName: vllm
  # model, worker or all: extra engine-level timing attributes on the span.
  detailedTraces: all

runtimeClassName: nvidia

resources:
  limits:
    cpu: "4"
    memory: 16Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 8Gi
    nvidia.com/gpu: "1"


huggingfaceTokenSecret: ""
