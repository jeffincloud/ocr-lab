apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocr-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocr-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ocr-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocr-frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_HOST
              value: {{ .Values.api.host | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
