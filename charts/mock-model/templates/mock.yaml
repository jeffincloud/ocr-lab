apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: MOCK_MODEL_NAME, value: {{ .Values.servedName | quote }}}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - {name: http, port: 8080, targetPort: http}
