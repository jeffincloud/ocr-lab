image:
  repository: ghcr.io/REPLACE_ME/ocr-lab/api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# Env passed to the FastAPI container. Anything here is exposed verbatim.
env:
  OCR_BACKEND: "openai"
  # The LLMInferenceService route on the Gateway (charts/model-llmd):
  #   kubectl get llmisvc qwen3-5-9b -o jsonpath='{.status.url}'
  # scripts/lab-up.sh sets this for you.
  OPENAI_BASE_URL: "http://REPLACE_WITH_LLMISVC_URL"
  OPENAI_MODEL_NAME: "qwen3-5-9b"
  # Engine-specific request fields. Thinking on costs tokens and latency per extraction.
  # Set to "" for a hosted API that rejects unknown fields.
  OPENAI_EXTRA_BODY: '{"chat_template_kwargs": {"enable_thinking": true}}'
  # Covers the reasoning as well as the JSON (about 640 together). 1024 leaves little
  # margin; the cap also ends a runaway reasoning loop quickly, which at 4096 tied up
  # a request for over a minute and still produced no answer.
  OPENAI_MAX_TOKENS: "1500"
  # KServe's gateway route uses a self-signed certificate.
  OPENAI_TLS_VERIFY: "false"
  OPENAI_TIMEOUT: "60"
  # Stream responses so the API can time the first token (client-side TTFT).
  OPENAI_STREAM: "true"
  # "vllm" when self-hosted; the provider's name (e.g. "openai") for the closed-API comparison.
  GENAI_PROVIDER_NAME: "vllm"
  # Put the static prompt before the image (prefix-cache experiment).
  PROMPT_FIRST: "false"
  MAX_IMAGE_DIM: "1024"
  UVICORN_WORKERS: "2"
  API_THREADPOOL_SIZE: "64"
  # OpenTelemetry: traces, metrics (with exemplars) and logs to the collector.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc:4318"
  OTEL_SERVICE_NAME: "ocr-api"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ocr-lab,deployment.environment.name=gpu-lab"
  # Set to a comma-separated origin list to opt into CORS. Leave blank when
  # the frontend reverse-proxies /api (the cluster default).
  ALLOWED_ORIGINS: ""

# Secret holding the key for the model's route (scripts/lab-up.sh creates it), set
# as OPENAI_API_KEY. Optional: without the Secret the API sends a placeholder.
modelApiKeySecret: model-api-key

# Image resize + base64 is CPU work: 500m throttled under load. Watch
# container_cpu_cfs_throttled_periods_total before tightening this.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

probes:
  readinessPath: /healthz
  livenessPath: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
