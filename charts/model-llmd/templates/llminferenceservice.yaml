{{- $mock := eq .Values.mode "mock" }}
{{- $scheme := ternary "HTTPS" "HTTP" .Values.tls }}
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ocr-model
    ocr-lab/mode: {{ .Values.mode }}
spec:
  model:
    {{- if $mock }}
    uri: {{ .Values.model.uri }}
    {{- else }}
    uri: pvc://{{ .Values.weights.claim }}/{{ .Values.weights.subPath }}
    {{- end }}
    name: {{ .Values.model.name }}
  replicas: {{ .Values.replicas }}
  rolloutStrategy:
    {{- toYaml .Values.rolloutStrategy | nindent 4 }}
  {{- if $mock }}
  # The mock needs no weights; skip the download init container.
  storageInitializer:
    enabled: false
  {{- end }}
  router:
    # llm-d inference scheduler (endpoint picker) with KServe's default
    # scorers: queue depth, KV-cache utilization, prefix-cache affinity.
    scheduler: {}
    {{- if .Values.route.chatCompletionsOnly }}
    # One rule, one match. Envoy Gateway adds an endpoint-picker filter to the
    # listener for every route match that targets the InferencePool, and all of
    # them run on every request: KServe's default route has 16 such matches, so
    # each request was scheduled 16 times. The API only calls chat completions.
    route:
      http:
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: {{ .Values.route.gateway.name }}
              namespace: {{ .Values.route.gateway.namespace }}
          rules:
            - name: v1-chat-completions-path
              matches:
                - path:
                    type: PathPrefix
                    value: /{{ .Release.Namespace }}/{{ .Values.model.name }}/v1/chat/completions
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/chat/completions
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: {{ .Values.model.name }}-inference-pool
                  port: 8000
              timeouts:
                request: 0s
                backendRequest: 0s
    {{- else }}
    route: {}
    {{- end }}
    gateway: {}
  {{- if .Values.tracing.enabled }}
  tracing:
    exporterEndpoint: {{ .Values.tracing.exporterEndpoint | quote }}
    sampler: parentbased_traceidratio
    samplerArg: {{ .Values.tracing.samplerArg | quote }}
  {{- end }}
  template:
    {{- if not $mock }}
    {{- with .Values.runtimeClassName }}
    runtimeClassName: {{ . }}
    {{- end }}
    volumes:
      - name: model-weights
        persistentVolumeClaim:
          claimName: {{ .Values.weights.claim }}
    initContainers:
      - name: fetch-weights
        image: {{ .Values.weights.downloaderImage }}
        args:
          - {{ .Values.model.uri }}
          - /weights/{{ .Values.weights.subPath }}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        volumeMounts:
          - {name: model-weights, mountPath: /weights}
        resources:
          {{- toYaml .Values.weights.resources | nindent 10 }}
    {{- end }}
    containers:
      - name: main
        {{- if $mock }}
        image: {{ .Values.mock.image }}
        imagePullPolicy: {{ .Values.mock.imagePullPolicy }}
        # Replace KServe's "vllm serve" wrapper. Extra args KServe appends
        # (tracing flags) land in $@ and are ignored.
        command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log ${SSL_CERTFILE:+--ssl-certfile $SSL_CERTFILE --ssl-keyfile $SSL_KEYFILE}", "--"]
        env:
          - {name: MOCK_MODEL_NAME, value: {{ .Values.model.name | quote }}}
          {{- if .Values.tls }}
          - {name: SSL_CERTFILE, value: /var/run/kserve/tls/tls.crt}
          - {name: SSL_KEYFILE, value: /var/run/kserve/tls/tls.key}
          {{- end }}
          {{- if .Values.tracing.enabled }}
          - {name: OTEL_SERVICE_NAME, value: {{ .Values.tracing.serviceName | quote }}}
          {{- end }}
          {{- range $k, $v := .Values.mock.env }}
          - {name: {{ $k }}, value: {{ $v | quote }}}
          {{- end }}
        resources:
          {{- toYaml .Values.mock.resources | nindent 10 }}
        {{- else }}
        image: {{ .Values.image }}
        # KServe's template sets runAsNonRoot, but the upstream vLLM image has no
        # USER, so the kubelet refuses to start it without an explicit UID. HOME,
        # /tmp and the model directories are writable volumes KServe mounts.
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: {{ .Values.vllmArgs | quote }}
          {{- if .Values.tracing.enabled }}
          - {name: OTEL_SERVICE_NAME, value: {{ .Values.tracing.serviceName | quote }}}
          {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        # Model download + load + CUDA graph capture can take minutes on a
        # cold node; don't let the liveness probe kill a pod that is loading.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: {{ $scheme }}
          periodSeconds: 10
          failureThreshold: 90
