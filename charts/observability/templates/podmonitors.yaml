{{- range $name, $t := .Values.scrape }}
{{- if $t.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ocr-{{ $name | kebabcase }}
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ $t.namespace | quote }}]
  selector:
    {{- toYaml $t.selector | nindent 4 }}
  podMetricsEndpoints:
    - targetPort: {{ $t.targetPort }}
      path: /metrics
      interval: 10s
      scheme: {{ $t.scheme | default "http" }}
      {{- if eq ($t.scheme | default "http") "https" }}
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
{{- end }}
{{- end }}
