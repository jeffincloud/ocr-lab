      (sum(rate(vllm:time_to_first_token_seconds_count[1h])))
    labels: *id005
  - record: slo:sli_error:ratio_rate2h
    expr: |-
      (sum(rate(vllm:time_to_first_token_seconds_count[2h])) - sum(rate(vllm:time_to_first_token_seconds_bucket{le=~"2.5"}[2h])))
      /
      (sum(rate(vllm:time_to_first_token_seconds_count[2h])))
    labels: *id005
  - record: slo:sli_error:ratio_rate6h
    expr: |-
      (sum(rate(vllm:time_to_first_token_seconds_count[6h])) - sum(rate(vllm:time_to_first_token_seconds_bucket{le=~"2.5"}[6h])))
      /
      (sum(rate(vllm:time_to_first_token_seconds_count[6h])))
    labels: *id005
  - record: slo:sli_error:ratio_rate1d
    expr: |-
      (sum(rate(vllm:time_to_first_token_seconds_count[1d])) - sum(rate(vllm:time_to_first_token_seconds_bucket{le=~"2.5"}[1d])))
      /
      (sum(rate(vllm:time_to_first_token_seconds_count[1d])))
    labels: *id005
  - record: slo:sli_error:ratio_rate3d
    expr: |-
      (sum(rate(vllm:time_to_first_token_seconds_count[3d])) - sum(rate(vllm:time_to_first_token_seconds_bucket{le=~"2.5"}[3d])))
      /
      (sum(rate(vllm:time_to_first_token_seconds_count[3d])))
    labels: *id005
  - record: slo:sli_error:ratio_rate28d
    expr: avg_over_time(slo:sli_error:ratio_rate5m{slo="inference-ttft"}[28d])
    labels: *id005
- name: slo-meta-inference-ttft
  interval: 30s
  rules:
  - record: slo:objective:ratio
    expr: vector(0.95)
    labels: *id005
  - record: slo:error_budget:ratio
    expr: vector(0.05)
    labels: *id005
  - record: slo:current_burn_rate:ratio
    expr: |-
      slo:sli_error:ratio_rate5m{slo="inference-ttft"}
      / on (slo, layer) group_left
      slo:error_budget:ratio{slo="inference-ttft"}
    labels: *id005
  - record: slo:period_error_budget_remaining:ratio
    expr: |-
      1 - slo:sli_error:ratio_rate28d{slo="inference-ttft"}
      / on (slo, layer) group_left
      slo:error_budget:ratio{slo="inference-ttft"}
    labels: *id005
- name: slo-alerts-inference-ttft
  rules:
  - alert: SLOBurnInferenceTtft1H
    expr: |-
      (slo:sli_error:ratio_rate1h{slo="inference-ttft"} > (14.4 * 0.05))
      and
      (slo:sli_error:ratio_rate5m{slo="inference-ttft"} > (14.4 * 0.05))
    labels:
      slo: inference-ttft
      layer: inference
      severity: page
      burn_window: 1h/5m
    annotations:
      summary: inference-ttft is burning its error budget 14.4x too fast (1h/5m windows)
      description: Requests whose first token came back within 2.5 s, measured by the engine (vLLM).
  - alert: SLOBurnInferenceTtft6H
    expr: |-
      (slo:sli_error:ratio_rate6h{slo="inference-ttft"} > (6 * 0.05))
      and
      (slo:sli_error:ratio_rate30m{slo="inference-ttft"} > (6 * 0.05))
    labels:
      slo: inference-ttft
      layer: inference
      severity: page
      burn_window: 6h/30m
    annotations:
      summary: inference-ttft is burning its error budget 6x too fast (6h/30m windows)
      description: Requests whose first token came back within 2.5 s, measured by the engine (vLLM).
  - alert: SLOBurnInferenceTtft1D
    expr: |-
      (slo:sli_error:ratio_rate1d{slo="inference-ttft"} > (3 * 0.05))
      and
      (slo:sli_error:ratio_rate2h{slo="inference-ttft"} > (3 * 0.05))
    labels:
      slo: inference-ttft
      layer: inference
      severity: ticket
      burn_window: 1d/2h
    annotations:
      summary: inference-ttft is burning its error budget 3x too fast (1d/2h windows)
      description: Requests whose first token came back within 2.5 s, measured by the engine (vLLM).
  - alert: SLOBurnInferenceTtft3D
    expr: |-
      (slo:sli_error:ratio_rate3d{slo="inference-ttft"} > (1 * 0.05))
      and
      (slo:sli_error:ratio_rate6h{slo="inference-ttft"} > (1 * 0.05))
    labels:
      slo: inference-ttft
      layer: inference
      severity: ticket
      burn_window: 3d/6h
    annotations:
      summary: inference-ttft is burning its error budget 1x too fast (3d/6h windows)
      description: Requests whose first token came back within 2.5 s, measured by the engine (vLLM).
- name: inference-saturation
  rules:
  - alert: InferenceQueueBuilding
    expr: histogram_quantile(0.95, sum by (le) (rate(vllm:request_queue_time_seconds_bucket[5m]))) > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: p95 time waiting in the vLLM queue is above 1 s; the engine is saturated.
  - alert: KVCacheNearlyFull
    expr: max(vllm:kv_cache_usage_perc) > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: KV cache above 90%; expect preemptions and TTFT growth.
  - alert: InferencePreemptions
    expr: sum(rate(vllm:num_preemptions_total[5m])) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: vLLM is preempting sequences (KV cache pressure).
  - alert: GPUThrottling
    expr: max(DCGM_FI_DEV_GPU_TEMP) > 83 or max(DCGM_FI_DEV_CLOCKS_EVENT_REASONS) > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: GPU hot or clock-throttled; sustained-load latency will drift.
  - alert: GPUXidError
    expr: max(DCGM_FI_DEV_XID_ERRORS) > 0
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: The GPU driver reported an XID error.
