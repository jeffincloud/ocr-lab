# Layered on top of base.yaml inside Kubernetes (collector --config base
# --config k8s --config scrape; the scrape part is generated from the chart's
# .Values.scrape).
# Adds pod/namespace/node metadata so every span, metric and log can be joined
# with kube-state-metrics, DCGM (by pod) and Kubernetes events, and collects
# two log sources that matter for cold starts:
#   - container logs of the model server (vLLM prints weight-load and
#     CUDA-graph-capture times) and the gateway;
#   - Kubernetes events (Scheduled, Pulling, Pulled, Started, Unhealthy).
# The collector runs as a DaemonSet; on a multi-node cluster move the events
# receiver to a single-replica collector so events aren't collected N times.

receivers:
  filelog/pods:
    include:
      - /var/log/pods/${env:LOG_NAMESPACES_GLOB}_*/*/*.log
    exclude:
      - /var/log/pods/*_opentelemetry-collector*/*/*.log
    start_at: end
    include_file_path: true
    operators:
      - type: container
        id: container-parser
  k8sobjects/events:
    objects:
      - name: events
        mode: watch
        group: events.k8s.io
  # Pod and container CPU, memory and network from the kubelet on this node,
  # as OTel metrics (k8s.pod.*, k8s.container.*, container.*): replaces the
  # cAdvisor scrape for the API's CPU saturation panels.
  kubeletstats:
    collection_interval: 15s
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    insecure_skip_verify: true
    metric_groups: [pod, container]
    metrics:
      k8s.container.cpu_limit_utilization: {enabled: true}
      k8s.container.memory_limit_utilization: {enabled: true}
      k8s.pod.cpu_limit_utilization: {enabled: true}

processors:
  # Name the two log sources that arrive without a service.name, so Loki
  # doesn't file them under "unknown_service" or the container name:
  # Kubernetes events -> "k8s-events"; pod logs -> the pod's app.kubernetes.io/name.
  transform/k8s_logs:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["service.name"], "k8s-events") where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.name"] == nil
          - set(resource.attributes["service.name"], resource.attributes["app.kubernetes.io/name"]) where resource.attributes["service.name"] == nil and resource.attributes["app.kubernetes.io/name"] != nil

  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
        - k8s.container.name
      labels:
        - tag_name: app.kubernetes.io/name
          key: app.kubernetes.io/name
          from: pod
    pod_association:
      # Pod logs (filelog) carry the pod UID from their file path.
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, redaction/spans, transform/scrub, resource/lab, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, kubeletstats, prometheus/k8s]
      processors: [memory_limiter, k8sattributes, transform/cardinality, resource/lab, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp, filelog/pods, k8sobjects/events]
      processors: [memory_limiter, k8sattributes, transform/k8s_logs, transform/scrub, resource/lab, batch]
      exporters: [otlphttp/loki]
